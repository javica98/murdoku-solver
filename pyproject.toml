[project]
name = "murdoku-solver"
version = "0.1.0"
description = "Puzzle de logica tipo sudoku con pistas de un caso de asesinato, mas una webapp para generarlo, tematizarlo con un LLM y jugarlo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "truststore>=0.10.4",
    "uvicorn>=0.52.3",
]

[tool.uv]
system-certs = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["murdoku"]
